name: Frontend CI

on:
  push:
    branches: [ "main", "master", "feat/*" ]
    paths:
      - 'digilib-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'digilib-frontend/**'

jobs:
  build-frontend:
    name: Build Frontend (React)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: digilib-frontend/package-lock.json

    - name: Build Frontend
      working-directory: ./digilib-frontend
      run: |
        npm install
        npm run build
